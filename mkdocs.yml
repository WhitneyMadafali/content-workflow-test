site_name: 内容扫描指南
site_description: SharePoint 与 Teams 扫描、筛选与导出流程文档
site_author: "OVES"
use_directory_urls: false

docs_dir: docs
site_dir: site

extra_javascript:
  - https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  oves_doc_version: "0.1.2"
  oves_last_editor: "Janice"
  oves_revision_summary: "Add step-by-step Forms responses MCP procedure to MkDocs"
  oves_revision_date: "2026-04-13"
  alternate:
    - name: 中文
      link: /content-workflow/
      lang: zh
    - name: English
      link: /content-workflow/en/
      lang: en
    - name: Français
      link: /content-workflow/fr/
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg
      classes: uml-diagram
      title: System Architecture Diagram
      alt: System Architecture Diagram

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          build: true
          default: true
          site_name: 内容扫描指南
          site_description: SharePoint 与 Teams 扫描、筛选与导出流程文档
          nav_translations:
            Home: 首页
            SharePoint Scan: SharePoint 扫描
            Teams Scan: Teams 扫描
            Teams MCP: Teams MCP
            Forms responses MCP: Forms 答卷 MCP
            Forms links in Teams: Teams 频道中的 Forms 链接
        - locale: en
          name: English
          build: true
          site_name: Content Scanning Guide
          site_description: Documentation for SharePoint and Teams scanning, filtering, and export workflows
          nav_translations:
            Home: Home
            SharePoint Scan: SharePoint Scan
            Teams Scan: Teams Scan
            Teams MCP: Teams MCP
            Forms responses MCP: Forms responses MCP
            Forms links in Teams: Forms links in Teams
        - locale: fr
          name: Français
          build: true
          site_name: Guide d'analyse de contenu
          site_description: Documentation des workflows d'analyse, filtrage et export SharePoint et Teams
          nav_translations:
            Home: Accueil
            SharePoint Scan: Analyse SharePoint
            Teams Scan: Analyse Teams
            Teams MCP: MCP Teams
            Forms responses MCP: MCP reponses Forms
            Forms links in Teams: Liens Forms dans Teams
      reconfigure_material: true
      reconfigure_search: true

repo_name: ovesorg/content-workflow
repo_url: https://github.com/ovesorg/content-workflow
copyright: Copyright &copy; 2026 Omnivoltaic Energy Solutions

nav:
  - Home: index.md
  - SharePoint Scan: tools/sharepoint-scan.md
  - Teams Scan: tools/teams-scan.md
  - Teams MCP: tools/teams-mcp.md
  - Forms responses MCP: tools/forms-responses-mcp.md
  - Forms links in Teams: tools/forms-mcp.md

site_name: 智能飞行平台技术方案
site_description: 工业级无人机技术参数与应用案例
site_author: "OVES"
use_directory_urls: false

docs_dir: docs
site_dir: site

extra_javascript:
  - https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  oves_doc_version: "0.1.1"
  oves_last_editor: "Janice"
  oves_revision_summary: "Initial content-workflow documentation structure"
  oves_revision_date: "2026-03-16"
  alternate:
    - name: 中文
      link: /content-workflow/
      lang: zh
    - name: English
      link: /content-workflow/en/
      lang: en
    - name: Français
      link: /content-workflow/fr/
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg
      classes: uml-diagram
      title: System Architecture Diagram
      alt: System Architecture Diagram

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          build: true
          default: true
          nav_translations:
            Home: 首页
            SharePoint Scan: SharePoint 扫描
            Teams Scan: Teams 扫描
        - locale: en
          name: English
          build: true
          nav_translations:
            Home: Home
            SharePoint Scan: SharePoint Scan
            Teams Scan: Teams Scan
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            SharePoint Scan: Analyse SharePoint
            Teams Scan: Analyse Teams
      reconfigure_material: true
      reconfigure_search: true

repo_name: ovesorg/content-workflow
repo_url: https://github.com/ovesorg/content-workflow
copyright: Copyright &copy; 2026 Omnivoltaic Energy Solutions

nav:
  - Home: index.md
  - SharePoint Scan: tools/sharepoint-scan.md
  - Teams Scan: tools/teams-scan.md
